<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>THE REACTOR GAME - continuation icon</title>
<!--
  ============================================================================
  TRG:CONTINUATION 的游戏图标 —— 1024x1024（1:1）

  Phase 149（2026-10-31）。操作员原话：
    「帮我设计个The Reactor Game - Continuation的图标（1：1的）然后还是别太复杂，
      要体现Continuation」
  Phase 150 返工，原话：
    「有点奇怪啊改一下，而且是trg的continuation，你TRG也要有一定体现」

  一句话：**TRG 的厂标本体，只改它外面那一圈 —— 那圈不闭合，末端就是笔画的尖。**
  厂标不是重画的：它就是 intro/assets/sm-core.png，封面用的同一个文件
  （Phase 133 的规矩：引用不复制）。变的是**环**：页面把素材自带的外环裁掉
  （clip 在 r=240 素材像素，落在"臂到 236 为止、环从 242 起"这条**空带**里），
  再按**素材自己的半径**画一圈 —— 和印出来的那圈同一个圆，唯一的不同是它开着口。
  于是"TRG"是游戏自己的记号、逐像素一条不差，
  "continuation"是这张记号上唯一被改动的那一处。

  v1 是一个单独的六边 + 缺口 + 浮在缺口中间的三角 + 一枚青色小六边：
  那不是 TRG，读起来是一枚"刷新/循环"徽章，而悬空的三角像"下一页"按钮。
  v2 把核心换成厂标，但箭头还是一枚**贴上去的琥珀三角**：底边 68px，而环才 13px，
  五倍宽 —— 读起来是一顶帽子，不是笔画（操作员：「有点奇怪」）。
  **v3（这一版）把箭头做成环自己的尖**：同色、底边 30px（环粗 14.8 的两倍）、
  底边正落在弧的端点上，所以它和环是一件东西，不是两件。
  三条判据钉住这件事：底边离环 0px（C8）、尖落在切线的解上（C8）、
  环的半径等于素材环的半径（C6 + 像素那一份 continuation_ring_check.py）。

  **契约与封面、两部片子完全一样**（见下面 render 那一段）：固定的设计空间
  #stage（1024x1024）、一个全局的 render(t)、一个按视口缩放的 fit()。
  图标也是静止画，所以 render(t) 收下 t 就丢 —— 每一次调用画出同一幅画。

  **颜色逐字抄自 cover/index.html**，它的出处是 src/ReactorBackend/Config.luau
  的 Config.Visual。**这里一个新颜色都不许发明。**
  ============================================================================
-->
<style>
:root{
  --void:   #07080a;
  --ready:  rgb(235,235,235);   /* Config.Visual.Ready */
  --amber:  rgb(255,128,1);     /* Config.Visual.Amber */
  --plasma: #52dae2;            /* ART_DIRECTION §2 的冷却/等离子青 */
  --mono: ui-monospace, "Cascadia Mono", "JetBrains Mono", Consolas, "Courier New", monospace;
  --cond: "Arial Narrow", "Haettenschweiler", Impact, "Franklin Gothic Medium", sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:#000;color:var(--ready);font-family:var(--mono);overflow:hidden;
     -webkit-font-smoothing:antialiased;}

/* 固定的设计空间 —— 和片头/封面同一个理由：版面上写的数字和屏幕上发生的事
   是同一件事。1024 不是随手挑的：Roblox 的图标格吃 512，1024 是它的两倍，
   缩一半之后每个坐标仍然落在整数像素上。 */
#viewport{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000}
#stage{
  position:relative;width:1024px;height:1024px;flex:none;overflow:hidden;
  background:radial-gradient(ellipse 118% 92% at 50% 42%, #0a0e12 0%, var(--void) 64%, #000 100%);
  transform-origin:center center;
}
.layer{position:absolute;inset:0;pointer-events:none}

/* ============================ 外框 ============================
   控制台面板的语言（AREMAKE 监视器的边框）。它一句话也不说，所以不算要素；
   方画面上没有它，四周就是一片空的 —— 缩略图上会显得没画完。 */
#frame{position:absolute;left:20px;top:20px;right:20px;bottom:20px;
       border:1px solid rgba(82,218,226,.28);}
.brk{position:absolute;width:18px;height:18px;border:2px solid rgba(235,235,235,.5)}
.brk.tl{left:-2px;top:-2px;border-right:0;border-bottom:0}
.brk.tr{right:-2px;top:-2px;border-left:0;border-bottom:0}
.brk.bl{left:-2px;bottom:-2px;border-right:0;border-top:0}
.brk.br{right:-2px;bottom:-2px;border-left:0;border-top:0}

/* ============================ 光晕 ============================
   厂标后面那团青色。它是**装饰层**：不进任何几何断言，所以只能靠
   "关掉再比像素"（_tools/cover_layers.sh）证明它真的在画上（CLAUDE.md 0.32）。 */
#glow{position:absolute;inset:0;
  background:radial-gradient(circle at 512px 415px,
    rgba(82,218,226,.20) 0%, rgba(82,218,226,.07) 26%, rgba(82,218,226,0) 54%);}

/* ============================ 主体：厂标 + 开口的环 ============================
   厂标是**素材**（intro/assets/sm-core.png），不是重画的线稿：品牌这种东西
   手抄一遍就是抄错一遍。页面只裁掉它自带的外环，再按同一半径画一圈开口的环。
   半径、缺口、箭头全部由 JS 里的常数算出来，HTML 里一个字都不写 ——
   而 layoutReport() 仍然把**属性读回来**再和解析值比一次
   （封面 A6/A7 那条纪律：量 DOM，不量我以为我写了什么）。 */
#emblem{position:absolute;opacity:.97}
#markSvg{position:absolute;left:0;top:0}
/* 圆头两端的环：尾端是"从无到有"，头端被箭头盖住。 */
#ringPath{fill:none;stroke:var(--ready);stroke-linejoin:miter;stroke-linecap:round;
  opacity:.92;filter:drop-shadow(0 0 16px rgba(82,218,226,.55));}
/* 箭头和环**同一个颜色**：它是那根笔画自己的尖，不是贴上去的第二个物体
   （v2 的琥珀三角底边 68px、环才 13px —— 读起来是一顶帽子，这就是"有点奇怪"）。
   底边 2 倍粗、沿着切线伸出去 60px，尖端带一点琥珀的余温。 */
#headTri{fill:var(--ready);opacity:.92;
  filter:drop-shadow(0 0 16px rgba(255,128,1,.50)) drop-shadow(0 0 22px rgba(82,218,226,.35));}

/* ============================ 字 ============================
   大词一行、小字一行。大词是这张图唯一的"说出来的东西"：
   图标缩到 1/5 时，80px 的字还有 16px —— 读得出；再小就不该放在图标上。 */
#title{
  position:absolute;left:0;right:0;top:715px;text-align:center;
  font-family:var(--cond);font-size:118px;line-height:1.0;letter-spacing:.06em;
  color:#fff;text-transform:uppercase;white-space:nowrap;
  text-shadow:0 0 34px rgba(82,218,226,.45), 2px 0 0 rgba(255,40,40,.20), -2px 0 0 rgba(40,120,255,.20);
}
#sub{
  position:absolute;left:0;right:0;top:872px;text-align:center;
  font-size:22px;letter-spacing:.44em;color:rgba(235,235,235,.62);
  text-transform:uppercase;white-space:nowrap;
}

/* ============================ CRT 罩 ============================
   扫线 + 暗角，和封面同一套，压到极淡。 */
#scan{position:absolute;inset:0;
  background:repeating-linear-gradient(to bottom,
    rgba(0,0,0,0) 0px, rgba(0,0,0,0) 2px, rgba(0,0,0,.34) 3px, rgba(0,0,0,.34) 4px);
  opacity:.42}
#vig{position:absolute;inset:0;
  background:radial-gradient(ellipse 74% 64% at 50% 45%, rgba(0,0,0,0) 40%, rgba(0,0,0,.80) 100%)}
</style>
</head>
<body>
<div id="viewport">
<div id="stage">

  <div id="frame">
    <span class="brk tl"></span><span class="brk tr"></span>
    <span class="brk bl"></span><span class="brk br"></span>
  </div>

  <div id="glow" data-art="gradient"></div>

  <img id="emblem" src="../intro/assets/sm-core.png" alt="">

  <svg id="markSvg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024"
       width="1024" height="1024">
    <g id="ring"><path id="ringPath" d=""></path></g>
    <g id="head"><polygon id="headTri" points=""></polygon></g>
  </svg>

  <div id="title">CONTINUATION</div>
  <div id="sub">THE REACTOR GAME</div>

  <div class="layer"><div id="scan" data-art="gradient"></div></div>
  <div class="layer"><div id="vig"  data-art="gradient"></div></div>

</div><!-- /stage -->
</div><!-- /viewport -->

<script>
/* ==========================================================================
   render(t) —— 同一个契约，但不是时钟
   --------------------------------------------------------------------------
   _tools/intro_render.js 靠调用页面上的 render(t) 来成帧。图标是一瞬间，
   所以 t 收下就丢：每一次调用画出同一幅画，没有状态可以残留。
   ========================================================================== */
'use strict';

const ICON_W = 1024, ICON_H = 1024;
const FRAME_IN = 20;

/* ---- 厂标 -----------------------------------------------------------------
   素材 515x515，**实测**（alpha>=128，1440 条射线逐半径扫，_tools 里那份
   径向剖面就是它）：外环从 r=243 到 r=256 是 100% 覆盖，242 / 257 是半覆盖
   （抗锯齿），所以环的中线 r=249.5、粗 15.2；三条臂到 r=236 为止（235 还有
   9.5%，237 就 0 了）。于是 237..241 是**空的**，像素**裁**在 240 正落在这条
   空带里：臂留得住（余 4），环裁得掉（余 2）。
   S = 500/515 就是"素材像素 → 设计像素"。 */
const ASSET_PX = 515;
const EMBLEM_S = 500;                       // 厂标在画上的边长
const S        = EMBLEM_S / ASSET_PX;       // 0.9709
const MARK_CX  = 512, MARK_CY = 415;
const R_RING   = 249.5 * S;                 // 242.24：和印出来的那圈**同一个半径**
const RING_W   = 15.2  * S;                 // 14.76
const CLIP_R   = 240   * S;                 // 233.0：臂末端 229.1 / 环内缘 235.0

/* ---- 开口与箭头 -----------------------------------------------------------
   角度是屏幕坐标（x 右、y 下，顺时针 = 度数增大）。弧从 GAP_FROM 顺时针
   走 304° 到 GAP_TO；箭头长在 GAP_TO 的末端，方向 = 那一点的顺时针切线。
   缺口放在右上（292°..348°，56°）：**实测**素材三条臂在 24..36 / 144..156 /
   264..276（`r=230` 上量，每条 ~11.5° 宽），所以这条缺口一格都不碰它们，
   也避开下面的大字。 */
const GAP_FROM = 348;                       // 弧的起点（缺口的右下角）
const GAP_TO   = 292;                       // 弧的终点，箭头在这里
const HEAD_LEN = 66;
const HEAD_HALF= 15;                        // 底边 30 = 环粗 14.76 的 2.0 倍

const RAD = Math.PI / 180;
const onRing = deg => [MARK_CX + R_RING * Math.cos(deg * RAD),
                       MARK_CY + R_RING * Math.sin(deg * RAD)];
const fmt = p => p[0].toFixed(2) + ',' + p[1].toFixed(2);

function buildMark(){
  // 厂标：位置 + 尺寸 + 把这个素材自带的外环裁掉的半径
  const em = document.getElementById('emblem');
  em.style.left = (MARK_CX - EMBLEM_S / 2) + 'px';
  em.style.top  = (MARK_CY - EMBLEM_S / 2) + 'px';
  em.style.width = em.style.height = EMBLEM_S + 'px';
  em.style.clipPath = 'circle(' + CLIP_R.toFixed(2) + 'px at 50% 50%)';

  // 环：一段圆弧，缺口从 GAP_TO 到 GAP_FROM。sweep-flag 1 = 屏幕上的顺时针。
  const A = onRing(GAP_FROM), B = onRing(GAP_TO);
  const sweep = ((GAP_TO - GAP_FROM) % 360 + 360) % 360;    // 324（顺时针：角度增大）
  const large = sweep > 180 ? 1 : 0;
  document.getElementById('ringPath').setAttribute('d',
    'M ' + fmt(A) + ' A ' + R_RING.toFixed(3) + ' ' + R_RING.toFixed(3) +
    ' 0 ' + large + ' 1 ' + fmt(B));
  const ring = document.getElementById('ringPath');
  ring.style.strokeWidth = RING_W.toFixed(2) + 'px';

  // 箭头：顺时针切线 t = (-sin, cos)，底边**落在弧的末端 B 上**。环用 round
  // 线帽，所以弧的笔画本身会越过 B 半个粗，箭头的底边就埋在它下面 —— 两个形状
  // 接成一条，读起来是"这根笔画的尖"，而不是"贴在旁边的一枚三角"。
  const t = [-Math.sin(GAP_TO * RAD), Math.cos(GAP_TO * RAD)];
  const perp = [-t[1], t[0]];
  const tip = [B[0] + t[0] * HEAD_LEN, B[1] + t[1] * HEAD_LEN];
  const c1  = [B[0] + perp[0] * HEAD_HALF, B[1] + perp[1] * HEAD_HALF];
  const c2  = [B[0] - perp[0] * HEAD_HALF, B[1] - perp[1] * HEAD_HALF];
  document.getElementById('headTri').setAttribute('points', [tip, c1, c2].map(fmt).join(' '));
}

function render(t){
  void t;                            // 契约，不是输入（见上）
  buildMark();
}

/* ==========================================================================
   layoutReport() —— 给检查器读的那一份测量
   --------------------------------------------------------------------------
   **浏览器是尺子，判定写在 Node 里**（DECISIONS_2 309）。量的都是 DOM 上
   读回来的东西，不是上面那几个 const 的副本。
   ========================================================================== */
function glyphBox(el){
  const rg = document.createRange();
  rg.selectNodeContents(el);
  const b = rg.getBoundingClientRect();
  return {id: el.id, top: +b.top.toFixed(2), bottom: +b.bottom.toFixed(2),
          left: +b.left.toFixed(2), right: +b.right.toFixed(2),
          text: (el.textContent || '').trim().slice(0, 40)};
}
function parsePts(s){
  return s.trim().split(/\s+/).filter(Boolean).map(q => q.split(',').map(Number));
}
function layoutReport(){
  render(0);
  const st = document.getElementById('stage').getBoundingClientRect();
  const rel = b => ({id: b.id, text: b.text,
    top: +(b.top - st.top).toFixed(2), bottom: +(b.bottom - st.top).toFixed(2),
    left: +(b.left - st.left).toFixed(2), right: +(b.right - st.left).toFixed(2)});
  const text = ['title', 'sub'].map(id => rel(glyphBox(document.getElementById(id))));

  // ---- 环：**从画出来的 path 上取点**（getPointAtLength），再量每一点到圆心
  // 的距离。这是"画的是一条以 (cx,cy) 为心、R 为半径的圆弧"这件事的读数，
  // 不是把那几个常数再抄一遍。
  const C = [MARK_CX, MARK_CY];
  const ring = document.getElementById('ringPath');
  const L = ring.getTotalLength();
  const pt = p => [p.x, p.y];                 // getPointAtLength 回的是 DOMPoint
  const samples = [];
  for (let i = 0; i <= 8; i++) samples.push(pt(ring.getPointAtLength(L * i / 8)));
  const radii = samples.map(p => Math.hypot(p[0] - C[0], p[1] - C[1]));
  const rMin = Math.min(...radii), rMax = Math.max(...radii);
  const A = samples[0], B = samples[samples.length - 1];
  const angOf = p => (Math.atan2(p[1] - C[1], p[0] - C[0]) / RAD + 360) % 360;
  const angA = angOf(A), angB = angOf(B);
  const sweepDeg = ((angB - angA) % 360 + 360) % 360;   // 沿走的方向量
  const gapDeg   = 360 - sweepDeg;

  // ---- 缺口与箭头
  const gap = Math.hypot(A[0] - B[0], A[1] - B[1]);
  const head = parsePts(document.getElementById('headTri').getAttribute('points'));
  const tip = head[0], base = [(head[1][0] + head[2][0]) / 2, (head[1][1] + head[2][1]) / 2];
  const hd  = [tip[0] - base[0], tip[1] - base[1]];
  const hlen = Math.hypot(hd[0], hd[1]);
  const hdir = [hd[0] / hlen, hd[1] / hlen];
  // 箭尖到**起点**的距离：这才是"缺口有没有被头填掉"的读数（取舍 646）。
  const tipToStart = Math.hypot(tip[0] - A[0], tip[1] - A[1]);
  // 箭头的底边是不是落在环上（头不是飘在里/外）。箭尖本身沿切线前伸，
  // 它离圆心必然比 R 远 sqrt(R^2+len^2)-R ≈ 5.5 px —— 那是几何，不是缺陷，
  // 所以"在环上"这条断言量的是 **base**，不是 tip。
  const baseOffRing = Math.abs(Math.hypot(base[0] - C[0], base[1] - C[1]) - R_RING);
  const tipOffRing = Math.abs(Math.hypot(tip[0] - C[0], tip[1] - C[1]) - R_RING);
  // 环在 B 点的顺时针切线：t = (-sin, cos)。
  const t = [-Math.sin(angB * RAD), Math.cos(angB * RAD)];
  const dot = hdir[0] * t[0] + hdir[1] * t[1];

  // ---- 厂标：位置、尺寸、裁切半径
  const em = document.getElementById('emblem');
  const eb = em.getBoundingClientRect();
  const cs = getComputedStyle(em);
  const clipPx = (String(cs.clipPath).match(/circle\(([-\d.]+)px/) || [])[1];
  const emblem = {
    src: em.getAttribute('src'),
    left: +(eb.left - st.left).toFixed(2), top: +(eb.top - st.top).toFixed(2),
    w: +eb.width.toFixed(2), h: +eb.height.toFixed(2),
    clip: clipPx === undefined ? null : +(+clipPx).toFixed(2),
    opacity: +(+cs.opacity).toFixed(3)
  };

  // ---- 整体包围盒（环 + 箭头尖 + 厂标的方框），给"在外框以内"那条规则
  const curve = Array.from({length: 97}, (_, i) => pt(ring.getPointAtLength(L * i / 96)));
  const all = curve.concat([tip, [emblem.left, emblem.top],
                            [emblem.left + emblem.w, emblem.top + emblem.h]]);
  const bounds = {
    left:  +Math.min(...all.map(p => p[0])).toFixed(2),
    right: +Math.max(...all.map(p => p[0])).toFixed(2),
    top:   +Math.min(...all.map(p => p[1])).toFixed(2),
    bottom:+Math.max(...all.map(p => p[1])).toFixed(2)};

  // ---- 装饰层：声明的素材极性 vs 实际 filter（同封面 A9 的样式那一半）
  const decor = ['glow', 'scan', 'vig'].map(id => {
    const el = document.getElementById(id);
    const cs2 = getComputedStyle(el);
    return {id, opacity: +(+cs2.opacity).toFixed(3), blend: cs2.mixBlendMode,
            filter: cs2.filter === 'none' ? '' : cs2.filter,
            art: el.dataset.art || null};
  });

  // ---- 字体可用性（Phase 144 的教训）。同一串字在**每个候选家族**里各量一次：
  // 没装的家族会和 fallback 给出**相同的宽度**，装的给出不同的宽度。
  function widthIn(family){
    const s = document.createElement('span');
    s.style.cssText = 'position:absolute;left:-9999px;font-size:100px;' +
                      'font-weight:normal;white-space:nowrap;font-family:' + family;
    s.textContent = 'MMMMM CONTINUATION';
    document.body.appendChild(s);
    const w = s.getBoundingClientRect().width;
    s.remove();
    return +w.toFixed(2);
  }
  const fontProbe = {};
  for (const f of ['"Arial Narrow"', '"Haettenschweiler"', 'Impact',
                   '"Franklin Gothic Medium"', 'Arial', 'sans-serif']){
    fontProbe[f] = widthIn(f);
  }
  const condW = widthIn('var(--cond)');

  return JSON.stringify({
    stage:{w: st.width, h: st.height}, innerW: innerWidth, innerH: innerHeight,
    dpr: devicePixelRatio,
    text, decor,
    mark:{
      cx: MARK_CX, cy: MARK_CY, r: +R_RING.toFixed(3), ringW: +RING_W.toFixed(2),
      gap: +gap.toFixed(2), gapDeg: +gapDeg.toFixed(2), sweepDeg: +sweepDeg.toFixed(2),
      start: A.map(v => +v.toFixed(2)), end: B.map(v => +v.toFixed(2)),
      rMin: +rMin.toFixed(3), rMax: +rMax.toFixed(3),
      tipToStart: +tipToStart.toFixed(2), tipOffRing: +tipOffRing.toFixed(2),
      baseOffRing: +baseOffRing.toFixed(2),
      head:{tip, base, len: +hlen.toFixed(2), half: HEAD_HALF, dir: hdir,
            tan: [+t[0].toFixed(4), +t[1].toFixed(4)], dot: +dot.toFixed(4)},
      emblem,
      bounds
    },
    font:{condW100: condW, probe: fontProbe}
  });
}
</script>
<script>
/* 整体缩放贴合视口：设计空间固定 1024x1024。渲染器把视口钉成 1024x1024，
   所以这里 k 恰好是 1，截图就是设计空间本身。 */
function fit(){
  const k = Math.min(innerWidth / ICON_W, innerHeight / ICON_H);
  document.getElementById('stage').style.transform = 'scale(' + k + ')';
}
render(0);
fit();
addEventListener('resize', fit);
</script>
