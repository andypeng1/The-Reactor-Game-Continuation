<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>THE REACTOR GAME - continuation icon</title>
<!--
  ============================================================================
  TRG:CONTINUATION 的游戏图标 —— 1024x1024（1:1）

  Phase 149（2026-10-31）。操作员原话：
    「帮我设计个The Reactor Game - Continuation的图标（1：1的）然后还是别太复杂，
      要体现Continuation」

  一句话：**同一个六边，但它不闭合 —— 缺口那一端走出一枚箭头。**
  这张图里的六边是这个世界自己的形状（厂标的内外两圈、舱体铺装），
  闭合的六边说"一座建好的设施"，缺口 + 箭头说"它还在走"。
  这是"continue"这个动作在图形上的最小写法，而且它在 64px 上仍然读得出
  —— 图标和封面的区别就在这里：图标要在缩略图上立住，封面不用。

  **不是封面的缩小版。** 封面（cover/index.html）是 1080 方、厂标 + 大字 +
  徽章 + 页脚四样；这张只有**三样**：六边 + 缺口箭头 / 大词 CONTINUATION /
  一行小字 THE REACTOR GAME。操作员说「别太复杂」，所以页脚、徽章、
  "AIREMAKE" 那一格都没有搬过来。

  **契约与封面、两部片子完全一样**（见下面 render 那一段）：固定的设计空间
  #stage（1024x1024）、一个全局的 render(t)、一个按视口缩放的 fit()。
  图标也是静止画，所以 render(t) 收下 t 就丢 —— 每一次调用画出同一幅画。

  **颜色逐字抄自 cover/index.html**，它的出处是 src/ReactorBackend/Config.luau
  的 Config.Visual。**这里一个新颜色都不许发明。**
  ============================================================================
-->
<style>
:root{
  --void:   #07080a;
  --ready:  rgb(235,235,235);   /* Config.Visual.Ready */
  --amber:  rgb(255,128,1);     /* Config.Visual.Amber */
  --plasma: #52dae2;            /* ART_DIRECTION §2 的冷却/等离子青 */
  --mono: ui-monospace, "Cascadia Mono", "JetBrains Mono", Consolas, "Courier New", monospace;
  --cond: "Arial Narrow", "Haettenschweiler", Impact, "Franklin Gothic Medium", sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:#000;color:var(--ready);font-family:var(--mono);overflow:hidden;
     -webkit-font-smoothing:antialiased;}

/* 固定的设计空间 —— 和片头/封面同一个理由：版面上写的数字和屏幕上发生的事
   是同一件事。1024 不是随手挑的：Roblox 的图标格吃 512，1024 是它的两倍，
   缩一半之后每个坐标仍然落在整数像素上。 */
#viewport{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000}
#stage{
  position:relative;width:1024px;height:1024px;flex:none;overflow:hidden;
  background:radial-gradient(ellipse 118% 92% at 50% 42%, #0a0e12 0%, var(--void) 64%, #000 100%);
  transform-origin:center center;
}
.layer{position:absolute;inset:0;pointer-events:none}

/* ============================ 外框 ============================
   控制台面板的语言（AREMAKE 监视器的边框）。它一句话也不说，所以不算要素；
   方画面上没有它，四周就是一片空的 —— 缩略图上会显得没画完。 */
#frame{position:absolute;left:20px;top:20px;right:20px;bottom:20px;
       border:1px solid rgba(82,218,226,.28);}
.brk{position:absolute;width:18px;height:18px;border:2px solid rgba(235,235,235,.5)}
.brk.tl{left:-2px;top:-2px;border-right:0;border-bottom:0}
.brk.tr{right:-2px;top:-2px;border-left:0;border-bottom:0}
.brk.bl{left:-2px;bottom:-2px;border-right:0;border-top:0}
.brk.br{right:-2px;bottom:-2px;border-left:0;border-top:0}

/* ============================ 光晕 ============================
   堆芯后面那团青色。它是**装饰层**：不进任何几何断言，所以只能靠
   "关掉再比像素"（_tools/cover_layers.sh）证明它真的在画上（CLAUDE.md 0.32）。 */
#glow{position:absolute;inset:0;
  background:radial-gradient(circle at 512px 420px,
    rgba(82,218,226,.20) 0%, rgba(82,218,226,.07) 26%, rgba(82,218,226,0) 54%);}

/* ============================ 主体：不闭合的六边 + 箭头 ============================
   六边是**点顶**的（顶点朝上），和封面、厂标同一族。半径、缺口、箭头全部由
   JS 里的四个数算出来（HEX_R / GAP_A / GAP_B / HEAD_*），HTML 里一个字都不写 ——
   所以"画的"和"报的"只可能来自同一处，而 layoutReport() 仍然把**属性读回来**
   再和解析值比一次（封面 A6/A7 那条纪律：量 DOM，不量我以为我写了什么）。 */
#markSvg{position:absolute;left:0;top:0}
#loopPath{fill:none;stroke:var(--ready);stroke-width:7;
  stroke-linejoin:miter;stroke-linecap:butt;opacity:.92;
  filter:drop-shadow(0 0 14px rgba(82,218,226,.55));}
#headTri{fill:var(--amber);opacity:.96;
  filter:drop-shadow(0 0 16px rgba(255,128,1,.55));}
#coreHex{fill:var(--plasma);opacity:.9;
  filter:drop-shadow(0 0 18px rgba(82,218,226,.65));}

/* ============================ 字 ============================
   大词一行、小字一行。大词是这张图唯一的"说出来的东西"：
   图标缩到 1/5 时，80px 的字还有 16px —— 读得出；再小就不该放在图标上。 */
#title{
  position:absolute;left:0;right:0;top:715px;text-align:center;
  font-family:var(--cond);font-size:118px;line-height:1.0;letter-spacing:.06em;
  color:#fff;text-transform:uppercase;white-space:nowrap;
  text-shadow:0 0 34px rgba(82,218,226,.45), 2px 0 0 rgba(255,40,40,.20), -2px 0 0 rgba(40,120,255,.20);
}
#sub{
  position:absolute;left:0;right:0;top:872px;text-align:center;
  font-size:22px;letter-spacing:.44em;color:rgba(235,235,235,.62);
  text-transform:uppercase;white-space:nowrap;
}

/* ============================ CRT 罩 ============================
   扫线 + 暗角，和封面同一套，压到极淡。 */
#scan{position:absolute;inset:0;
  background:repeating-linear-gradient(to bottom,
    rgba(0,0,0,0) 0px, rgba(0,0,0,0) 2px, rgba(0,0,0,.34) 3px, rgba(0,0,0,.34) 4px);
  opacity:.42}
#vig{position:absolute;inset:0;
  background:radial-gradient(ellipse 74% 64% at 50% 45%, rgba(0,0,0,0) 40%, rgba(0,0,0,.80) 100%)}
</style>
</head>
<body>
<div id="viewport">
<div id="stage">

  <div id="frame">
    <span class="brk tl"></span><span class="brk tr"></span>
    <span class="brk bl"></span><span class="brk br"></span>
  </div>

  <div id="glow" data-art="gradient"></div>

  <svg id="markSvg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024"
       width="1024" height="1024">
    <g id="loop"><polyline id="loopPath" points=""></polyline></g>
    <g id="head"><polygon id="headTri" points=""></polygon></g>
    <g id="coreDot"><polygon id="coreHex" points=""></polygon></g>
  </svg>

  <div id="title">CONTINUATION</div>
  <div id="sub">THE REACTOR GAME</div>

  <div class="layer"><div id="scan" data-art="gradient"></div></div>
  <div class="layer"><div id="vig"  data-art="gradient"></div></div>

</div><!-- /stage -->
</div><!-- /viewport -->

<script>
/* ==========================================================================
   render(t) —— 同一个契约，但不是时钟
   --------------------------------------------------------------------------
   _tools/intro_render.js 靠调用页面上的 render(t) 来成帧。图标是一瞬间，
   所以 t 收下就丢：每一次调用画出同一幅画，没有状态可以残留。
   ========================================================================== */
'use strict';

const ICON_W = 1024, ICON_H = 1024;
const FRAME_IN = 20;

/* 主体那四个数 —— **唯一的来源**。HTML 里一条 path 都没有手写。
   点顶六边形：宽 = 2R*cos30，高 = 2R。 */
const HEX_R    = 245;
const MARK_CX  = 512, MARK_CY = 420;
const COS30    = Math.cos(Math.PI / 6);

/* 缺口和箭头。GAP_A / GAP_B 是**右边那条竖边**（v1 -> v2）上的两个比例：
   GAP_B 是笔画结束的位置（箭头所在，靠上），GAP_A 是笔画开始的位置（靠下）。
   两者之间就是缺口 —— 六边在这里**不闭合**。 */
const GAP_A    = 0.74;              // 0=上端(v1)，1=下端(v2)
const GAP_B    = 0.32;
const HEAD_LEN = 54;                // 箭头从笔画末端往前伸出的长度
const HEAD_HALF= 38;                // 箭头底边的一半宽

/* 芯：正中一枚实心小六边。有它，这个图形读作"反应堆"；没有它，
   一个缺口圆环 + 箭头就是洗衣机的"再洗一次"。 */
const CORE_R   = 44;

function hexPoints(cx, cy, r){
  const pts = [];
  for (let i = 0; i < 6; i++){
    const a = (-90 + 60 * i) * Math.PI / 180;
    pts.push([cx + r * Math.cos(a), cy + r * Math.sin(a)]);
  }
  return pts;
}
const fmt = p => p[0].toFixed(2) + ',' + p[1].toFixed(2);

function buildMark(){
  const V = hexPoints(MARK_CX, MARK_CY, HEX_R);

  // 右边那条边 v1 -> v2 上的两个点：A 是笔画起点（下），B 是笔画终点（上）。
  const lerp = (p, q, t) => [p[0] + (q[0] - p[0]) * t, p[1] + (q[1] - p[1]) * t];
  const A = lerp(V[1], V[2], GAP_A);
  const B = lerp(V[1], V[2], GAP_B);

  // 顺时针走：A -> v2 -> v3 -> v4 -> v5 -> v0 -> v1 -> B。
  // 缺口就是 B..A 这一段，箭头在 B 上，顺着行进方向（向下）指。
  const pts = [A, V[2], V[3], V[4], V[5], V[0], V[1], B];
  document.getElementById('loopPath').setAttribute('points', pts.map(fmt).join(' '));

  // 箭头：方向 = 行进方向（B 处的切线 = v1->v2 = (0,1)）。
  const dir = [0, 1];
  const perp = [-dir[1], dir[0]];
  const tip = [B[0] + dir[0] * HEAD_LEN, B[1] + dir[1] * HEAD_LEN];
  const c1  = [B[0] + perp[0] * HEAD_HALF, B[1] + perp[1] * HEAD_HALF];
  const c2  = [B[0] - perp[0] * HEAD_HALF, B[1] - perp[1] * HEAD_HALF];
  document.getElementById('headTri').setAttribute('points', [tip, c1, c2].map(fmt).join(' '));

  // 芯：一枚点顶小六边，实心。
  document.getElementById('coreHex').setAttribute(
    'points', hexPoints(MARK_CX, MARK_CY, CORE_R).map(fmt).join(' '));
}

function render(t){
  void t;                            // 契约，不是输入（见上）
  buildMark();
}

/* ==========================================================================
   layoutReport() —— 给检查器读的那一份测量
   --------------------------------------------------------------------------
   **浏览器是尺子，判定写在 Node 里**（DECISIONS_2 309）。量的都是 DOM 上
   读回来的东西，不是上面那几个 const 的副本。
   ========================================================================== */
function glyphBox(el){
  const rg = document.createRange();
  rg.selectNodeContents(el);
  const b = rg.getBoundingClientRect();
  return {id: el.id, top: +b.top.toFixed(2), bottom: +b.bottom.toFixed(2),
          left: +b.left.toFixed(2), right: +b.right.toFixed(2),
          text: (el.textContent || '').trim().slice(0, 40)};
}
function parsePts(s){
  return s.trim().split(/\s+/).filter(Boolean).map(q => q.split(',').map(Number));
}
function layoutReport(){
  render(0);
  const st = document.getElementById('stage').getBoundingClientRect();
  const rel = b => ({id: b.id, text: b.text,
    top: +(b.top - st.top).toFixed(2), bottom: +(b.bottom - st.top).toFixed(2),
    left: +(b.left - st.left).toFixed(2), right: +(b.right - st.left).toFixed(2)});
  const text = ['title', 'sub'].map(id => rel(glyphBox(document.getElementById(id))));

  // ---- 六边：从 DOM 的 points 属性读回来，再和"按 CENTER/R 算出来的解析值"比。
  // 读回来的点有 8 个：A / v2 v3 v4 v5 v0 v1 / B。中间六个才是顶点。
  const drawn = parsePts(document.getElementById('loopPath').getAttribute('points'));
  const V = hexPoints(MARK_CX, MARK_CY, HEX_R);
  const order = [2, 3, 4, 5, 0, 1];            // drawn[1..6] 对应 V[2],V[3],V[4],V[5],V[0],V[1]
  let worst = 0, worstAt = -1;
  for (let i = 0; i < 6; i++){
    const p = drawn[1 + i], q = V[order[i]];
    const d = Math.hypot(p[0] - q[0], p[1] - q[1]);
    if (d > worst){ worst = d; worstAt = i; }
  }

  // ---- 缺口与箭头
  const A = drawn[0], B = drawn[drawn.length - 1];
  const gap = Math.hypot(A[0] - B[0], A[1] - B[1]);
  const head = parsePts(document.getElementById('headTri').getAttribute('points'));
  const tip = head[0], base = [(head[1][0] + head[2][0]) / 2, (head[1][1] + head[2][1]) / 2];
  const hd  = [tip[0] - base[0], tip[1] - base[1]];
  const hlen = Math.hypot(hd[0], hd[1]);
  const hdir = [hd[0] / hlen, hd[1] / hlen];
  // 箭尖到笔画起点的距离：**这才是"缺口有没有被头填掉"的读数**。
  // 只看 gap 说不了这件事 —— 头可以正好长到把 gap 补完，那时候 gap 还是那么大。
  const tipToStart = Math.hypot(tip[0] - A[0], tip[1] - A[1]);
  // 箭尖到右边那条直线的横向偏差：头是不是**长在这条边上**，而不是飘在边内/边外。
  const tipOffEdge = Math.abs(tip[0] - B[0]);
  // 笔画末端那一小段的方向 = v1 -> B（drawn[6] -> drawn[7]）
  const seg = [B[0] - drawn[6][0], B[1] - drawn[6][1]];
  const slen = Math.hypot(seg[0], seg[1]);
  const sdir = [seg[0] / slen, seg[1] / slen];
  const dot  = hdir[0] * sdir[0] + hdir[1] * sdir[1];

  // ---- 芯
  const core = parsePts(document.getElementById('coreHex').getAttribute('points'));
  const coreR = Math.hypot(core[0][0] - MARK_CX, core[0][1] - MARK_CY);

  // ---- 整体包围盒（笔画 + 箭头尖 + 芯），给"在外框以内"那条规则
  const all = drawn.concat([tip], core);
  const bounds = {
    left:  +Math.min(...all.map(p => p[0])).toFixed(2),
    right: +Math.max(...all.map(p => p[0])).toFixed(2),
    top:   +Math.min(...all.map(p => p[1])).toFixed(2),
    bottom:+Math.max(...all.map(p => p[1])).toFixed(2)};

  // ---- 装饰层：声明的素材极性 vs 实际 filter（同封面 A9 的样式那一半）
  const decor = ['glow', 'scan', 'vig'].map(id => {
    const el = document.getElementById(id);
    const cs = getComputedStyle(el);
    return {id, opacity: +(+cs.opacity).toFixed(3), blend: cs.mixBlendMode,
            filter: cs.filter === 'none' ? '' : cs.filter,
            art: el.dataset.art || null};
  });

  // ---- 字体可用性（Phase 144 的教训：Arial Narrow 在这台机器上没有，标题
  // 实际用的是下一个 fallback；把"用的是哪一个"写进报告，不让它成为猜测）。
  // 同一串字在**每个候选家族**里各量一次：没装的家族会和 fallback 给出**相同的
  // 宽度**，装的给出不同的宽度。所以这张表是"这台机器上有哪些字体"的读数。
  function widthIn(family){
    const s = document.createElement('span');
    s.style.cssText = 'position:absolute;left:-9999px;font-size:100px;' +
                      'font-weight:normal;white-space:nowrap;font-family:' + family;
    s.textContent = 'MMMMM CONTINUATION';
    document.body.appendChild(s);
    const w = s.getBoundingClientRect().width;
    s.remove();
    return +w.toFixed(2);
  }
  const fontProbe = {};
  for (const f of ['"Arial Narrow"', '"Haettenschweiler"', 'Impact',
                   '"Franklin Gothic Medium"', 'Arial', 'sans-serif']){
    fontProbe[f] = widthIn(f);
  }
  const condW = widthIn('var(--cond)');

  return JSON.stringify({
    stage:{w: st.width, h: st.height}, innerW: innerWidth, innerH: innerHeight,
    dpr: devicePixelRatio,
    text, decor,
    mark:{
      cx: MARK_CX, cy: MARK_CY, r: HEX_R,
      gap: +gap.toFixed(2), gapFrac: +(gap / HEX_R).toFixed(4),
      start: A.map(v => +v.toFixed(2)), end: B.map(v => +v.toFixed(2)),
      tipToStart: +tipToStart.toFixed(2), tipOffEdge: +tipOffEdge.toFixed(2),
      worstVertexPx: +worst.toFixed(3), worstAt,
      head:{tip, base, len: +hlen.toFixed(2), half: HEAD_HALF, dir: hdir,
            segDir: sdir, dot: +dot.toFixed(4)},
      coreR: +coreR.toFixed(2),
      bounds
    },
    font:{condW100: condW, probe: fontProbe}
  });
}
</script>
<script>
/* 整体缩放贴合视口：设计空间固定 1024x1024。渲染器把视口钉成 1024x1024，
   所以这里 k 恰好是 1，截图就是设计空间本身。 */
function fit(){
  const k = Math.min(innerWidth / ICON_W, innerHeight / ICON_H);
  document.getElementById('stage').style.transform = 'scale(' + k + ')';
}
render(0);
fit();
addEventListener('resize', fit);
</script>
</body>
</html>
