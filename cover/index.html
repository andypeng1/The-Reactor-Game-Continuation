<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>THE REACTOR GAME - cover</title>
<!--
  ============================================================================
  TRG:AIREMAKE 的游戏封面 —— 1080x1080（1:1）

  Phase 132（2026-10-15）建：操作员原话「帮我做一个TRG:AIREMAKE的游戏封面1：1」。
  Phase 133：六边里的实拍换成厂标（原话「好吧，不用实拍图片」）。
  Phase 134（同一天）：**砍到四样东西**。原话「要素太多了，不需要这么复杂」。

    走掉的：顶栏三行小字 + 顶部细线、压在六边上的两条 HUD 读数、
    标题下面的副题和 specs、四格读数条、标题上那条斜纹带、背景的透视网格与
    六边纹、堆芯后面那团光晕、底边的警示斜纹、六边的两圈外虚线与六个顶点刻线、
    CRT 三条里的噪点。
    留下的：**外框 / 六边 + 厂标 / 标题 + AIREMAKE 徽章 / 页脚**。

  **契约**没变，一个字都没变（见下面 render 那一段）：
    - 一个固定的设计空间 #stage（1080x1080），整块按 k 等比缩放居中；
    - 页面上有一个全局函数 render(t)，渲染器靠调它来成帧。
  封面没有时钟，所以本页的 render(t) **接受 t 并忽略它** —— 每一次调用都画出同一
  幅画，这正是"封面"的意思。这不是给检查器开的口子：本页**没有任何随时间变化的
  东西**，没有状态可以残留，也就没有帧需要倒。
  渲染它的是和 intro/ promo/ 同一台尺子（_tools/intro_render.js）。

  **素材**只引用**本仓库里已经有的**文件（intro/assets/*.png），一个字节都没有新拷
  进来 —— 原 pack 被 .gitignore 排除（不是我们能发布的），所以引用的是"已经在仓库
  里的副本"，不新增曝光面。现在只剩两处：六边里的厂标 sm-core.png、页脚那枚小厂标
  sm-logo.png。**六边里没有照片，promo/ 下面一个文件都不引**（Phase 133）。

  **颜色**逐字抄自 intro/index.html，它的出处是 src/ReactorBackend/Config.luau
  的 Config.Visual（而那张表又是从 place 里量出来的）。**这里一个新颜色都不许发明。**
  ============================================================================
-->
<style>
:root{
  /* 这一页只用得到四档：底、白、琥珀、等离子青。其余几档（Off / Nominal /
     Yellow / Fault）在 intro/index.html 那张表里，这一页没有读者，就不搬过来了。 */
  --void:   #07080a;            /* 比 Off 更黑的底 */
  --ready:  rgb(235,235,235);   /* Config.Visual.Ready   */
  --amber:  rgb(255,128,1);     /* Config.Visual.Amber   */
  --plasma: #52dae2;            /* ART_DIRECTION §2: 官方素材采样的冷却/等离子青 */
  --mono: ui-monospace, "Cascadia Mono", "JetBrains Mono", Consolas, "Courier New", monospace;
  --cond: "Arial Narrow", "Haettenschweiler", Impact, "Franklin Gothic Medium", sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:#000;color:var(--ready);font-family:var(--mono);overflow:hidden;
     -webkit-font-smoothing:antialiased;}

/* 固定的设计空间。里面每一个数字都是"绝对像素"，这样版面上写的位置和屏幕上
   发生的事情是同一件事 —— 和片头同一个理由。 */
#viewport{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000}
#stage{
  position:relative;width:1080px;height:1080px;flex:none;overflow:hidden;
  background:radial-gradient(ellipse 120% 90% at 50% 46%, #0a0e12 0%, var(--void) 62%, #000 100%);
  transform-origin:center center;
}
.layer{position:absolute;inset:0;pointer-events:none}

/* ============================ 外框 ============================
   22px 内缩的一道细线 + 四角括号，是控制台面板的语言（AREMAKE 的监视器边框）。
   **它留着**：另外三样东西都浮在半空里，这一道线把方画面收住，
   "这是一台机器，不是一张海报"那句话有着落。它一句话也不说，所以不算要素。 */
#frame{position:absolute;left:22px;top:22px;right:22px;bottom:22px;
       border:1px solid rgba(82,218,226,.26);}
.brk{position:absolute;width:20px;height:20px;border:2px solid rgba(235,235,235,.55)}
.brk.tl{left:-2px;top:-2px;border-right:0;border-bottom:0}
.brk.tr{right:-2px;top:-2px;border-left:0;border-bottom:0}
.brk.bl{left:-2px;bottom:-2px;border-right:0;border-top:0}
.brk.br{right:-2px;bottom:-2px;border-left:0;border-top:0}

/* ============================ 堆芯：六边框里的厂标 ============================
   六边是这个世界自己的形状（厂标、舱体铺装）。方画面上一个内接六边天然把四角
   让出来给字，而主体还在正中。
   **两个几何必须重合**：面板的 clip-path（CSS 百分比）和 SVG 那圈实线（JS 按
   HEX_R 算出的像素点）描述的是同一个六边形。CSS 的百分比版本与尺寸无关，所以它
   错不了；SVG 那份错得了，所以 render() 里把它和盒子按同一个 HEX_R 一起算出来，
   然后由 cover_judge 逐顶点比一次（差 >0.5px 算红，A6/A7）。 */
#hexPanel{
  position:absolute;
  clip-path:polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
  background:
    radial-gradient(circle at 50% 50%, rgba(82,218,226,.22) 0%, rgba(82,218,226,.07) 36%, rgba(0,0,0,0) 64%),
    var(--void);
}
/* 厂标：Synthesis Manufacturing 那一枚 —— 外圈圆环、两个同心六边（内实外虚）、
   三根从内六边顶点伸出去的辐条，各以一枚矩形端子收尾。
   尺寸**是量出来的，不是试出来的**：这张线稿 515x515，墨色逐像素 rgb(255,255,255)，
   画在 alpha 里（0..255 逐档），而**墨的包围盒就是整个方框**（x 0..514、y 0..514）
   —— 也就是那圈外环内切于方框。所以 `contain` 之下圆环的直径**正好等于这个元素的
   边长**，下面给一个数就够了。复量：python -X utf8 _tools/cover_mark_check.py */
#coreMark{
  position:absolute;
  background:url("../intro/assets/sm-core.png") center/contain no-repeat;
  opacity:.92;
  filter:drop-shadow(0 0 26px rgba(82,218,226,.28));
}
#hexSvg{position:absolute;pointer-events:none}
#hexSvg .ink{fill:none;stroke:var(--plasma);stroke-width:2;opacity:.62}
#hexSvg .ink2{fill:none;stroke:rgba(235,235,235,.30);stroke-width:1}
/* 两圈外虚线 + 六个顶点刻线（Phase 132 有）在 Phase 134 走了：它们把同一个形状
   说第二遍、第三遍，而形状本身已经有面板和实线各说了一遍。 */

/* ============================ 标题 ============================
   徽章在上、大字在下、细线收尾 —— 片头 S7 那一套（intro §1 的 hero 几何），
   字号按 1080/1920 折下来。宽高都由 cover_judge 断言。 */
#badge{
  position:absolute;left:50%;top:726px;transform:translateX(-50%);
  padding:5px 12px 4px;border:1px solid var(--amber);color:var(--amber);
  font-size:13px;letter-spacing:.34em;white-space:nowrap;
  box-shadow:0 0 18px rgba(255,128,1,.16) inset;
}
#title{
  position:absolute;left:0;right:0;top:768px;text-align:center;
  font-family:var(--cond);font-size:96px;line-height:1.0;letter-spacing:.055em;
  color:#fff;text-transform:uppercase;
  text-shadow:0 0 34px rgba(82,218,226,.5), 2px 0 0 rgba(255,40,40,.24), -2px 0 0 rgba(40,120,255,.24);
}
#rule{position:absolute;left:50%;top:906px;width:560px;height:1px;
      transform:translateX(-50%);
      background:rgba(235,235,235,.42);box-shadow:0 0 10px rgba(82,218,226,.35)}

/* ============================ 页脚 ============================ */
#footL{position:absolute;left:44px;top:966px;height:32px;display:flex;align-items:center;gap:11px}
#smMark{width:26px;height:32px;background:url("../intro/assets/sm-logo.png") center/contain no-repeat;
        opacity:.62}
        /* SMLogo 是**近白**的（rgb(228,228,228)）—— 不加 invert 时它改 54 个像素的
           最大振幅；加上的话是 35（"一团暗块"而不是 logo）。极性错和没画，是两件事。 */
#footL span{font-size:10px;letter-spacing:.26em;color:rgba(235,235,235,.62);white-space:nowrap}
#footR{position:absolute;right:44px;top:974px;font-size:10px;letter-spacing:.26em;
       color:rgba(235,235,235,.56);white-space:nowrap}

/* ============================ CRT 罩 ============================
   扫线 + 暗角：片头的语言，压到极淡。**噪点那条走了** —— 它在 4.5% 上基本只是在
   给 PNG 加高频，让"像素幂等但不是字节幂等"这件事更吵，而它一个信息也不带。 */
#scan{position:absolute;inset:0;
  background:repeating-linear-gradient(to bottom,
    rgba(0,0,0,0) 0px, rgba(0,0,0,0) 2px, rgba(0,0,0,.34) 3px, rgba(0,0,0,.34) 4px);
  opacity:.55}
#vig{position:absolute;inset:0;
  background:radial-gradient(ellipse 76% 66% at 50% 47%, rgba(0,0,0,0) 38%, rgba(0,0,0,.78) 100%)}
</style>
</head>
<body>
<div id="viewport">
<div id="stage">

  <!-- ============ 装饰层 ============
       每一层的 `data-art` 声明的是**它那张素材的极性**，而"要不要 invert"完全由
       极性决定，cover_judge 的 A9 断言这两件事一致：
         white    —— 近白的线稿，**不许** invert（invert 成黑 = 振幅塌掉）
         gradient —— 纯 CSS 画的，没有素材，**更不许** invert（反色 = 调色板外的颜色）
       极性是量出来的，不是从"它是这个世界的素材"推的。复量：
         python -X utf8 _tools/cover_layer_probe.py
       Phase 132 那四个真实缺陷（黑素材喂给 screen = 逐像素为 0；近白素材喂给
       invert = 振幅塌到 1%–14%）的来源层在 Phase 134 被砍掉了，所以这里没有
       `black` 那一类了 —— A9 里"两种极性都要在场"那条自检跟着它的对象一起退场，
       剩下"声明必须和 filter 一致"。像素那一半没变：bash _tools/cover_layers.sh -->
  <div id="frame">
    <span class="brk tl"></span><span class="brk tr"></span>
    <span class="brk bl"></span><span class="brk br"></span>
  </div>

  <!-- ---------- 堆芯 ---------- -->
  <div id="hexPanel"></div>
  <div id="coreMark" data-art="white"></div>
  <svg id="hexSvg" xmlns="http://www.w3.org/2000/svg"></svg>

  <!-- ---------- 标题 ---------- -->
  <div id="badge">AIREMAKE</div>
  <div id="title">THE REACTOR GAME</div>
  <div id="rule"></div>

  <!-- ---------- 页脚 ---------- -->
  <div id="footL"><i id="smMark" data-art="white"></i><span>SYNTHESIS MANUFACTURING CORPORATION</span></div>
  <div id="footR">ICARUS INSTALLATION &#183; SECTOR 04</div>

  <div class="layer"><div id="scan" data-art="gradient"></div></div>
  <div class="layer"><div id="vig"  data-art="gradient"></div></div>

</div><!-- /stage -->
</div><!-- /viewport -->

<script>
/* ==========================================================================
   render(t) —— 同一个契约，但不是时钟
   --------------------------------------------------------------------------
   _tools/intro_render.js 靠调用页面上的 render(t) 来成帧，所以没有时钟的页面
   也必须有这个函数。封面是一瞬间，所以 t 收下就丢：每一次调用画出同一幅画。

   t 被忽略**不是**敷衍：本页没有任何东西按时间变化，所以不存在"哪一帧"这个问题。
   ========================================================================== */
'use strict';

/* 六边形的外接圆半径（设计空间像素）—— **唯一的那个数**：
   面板盒子、SVG 那圈实线全部由它推出来，所以它们不可能各自漂移。
   点顶六边形（顶点朝上）：高 = 2R，宽 = 2R*cos30°。 */
const HEX_R = 288;
const HEX_CX = 540, HEX_CY = 404;
const COS30 = Math.cos(Math.PI / 6);

/* 厂标的边长。**由六边的内切圆定，不是试出来的**：正六边的内切圆半径是
   R*cos30 = 249.4，所以直径 498 以内的圆都在六边里面；取 420 是留了 39 px
   的余量（六边那六条边中点处最紧）。A10 每次都会把这个余量读出来。 */
const MARK_D = 420;

/* 点顶六边形的六个顶点：从正上方开始，每 60° 一个。 */
function hexPoints(cx, cy, r){
  const pts = [];
  for (let i = 0; i < 6; i++){
    const a = (-90 + 60 * i) * Math.PI / 180;
    pts.push([cx + r * Math.cos(a), cy + r * Math.sin(a)]);
  }
  return pts;
}
const poly = (cx, cy, r) => hexPoints(cx, cy, r).map(p => p[0].toFixed(2) + ',' + p[1].toFixed(2)).join(' ');

function buildHex(){
  const hw = HEX_R * COS30;                       // 半宽
  const e = document.getElementById('hexPanel');
  e.style.width  = (2 * hw).toFixed(2) + 'px';
  e.style.height = (2 * HEX_R).toFixed(2) + 'px';
  e.style.left   = (HEX_CX - hw).toFixed(2) + 'px';
  e.style.top    = (HEX_CY - HEX_R).toFixed(2) + 'px';

  // 厂标：一个正方形元素、**不参与裁切** —— 它整个落在六边的内切圆里
  // （MARK_D/2 = 210 < 249.4），所以它离裁切线永远有 39 px，裁与不裁同形。
  // 这句话是可以用几何验的：A10 拿它到六条边线的有符号距离说话。
  const mark = document.getElementById('coreMark');
  mark.style.width  = MARK_D + 'px';
  mark.style.height = MARK_D + 'px';
  mark.style.left   = (HEX_CX - MARK_D / 2).toFixed(2) + 'px';
  mark.style.top    = (HEX_CY - MARK_D / 2).toFixed(2) + 'px';

  const S = 600, c = S / 2;                       // SVG 盒子比六边形大一圈
  const svg = document.getElementById('hexSvg');
  svg.setAttribute('viewBox', '0 0 ' + S + ' ' + S);
  svg.setAttribute('width',  S);
  svg.setAttribute('height', S);
  svg.style.left = (HEX_CX - c) + 'px';
  svg.style.top  = (HEX_CY - c) + 'px';

  let out = '';
  out += '<polygon class="ink"  points="' + poly(c, c, HEX_R) + '"/>';
  out += '<polygon class="ink2" points="' + poly(c, c, HEX_R - 10) + '"/>';
  svg.innerHTML = out;
}

function render(t){
  // t 是契约，不是输入（见上面那段）。每次调用都是完整的一次版面构建，所以幂等
  // —— 调一百遍和调一遍结果相同。Phase 132 量过：连渲多次的**像素**是同一幅
  // （最大差 Δ1、超 Δ2 的 0 个），而**字节**分成两个形态 —— 是像素幂等，
  // 不是字节幂等。别拿 md5 当判据（docs/COVER.md §4/§6）。
  void t;
  buildHex();
}

/* ==========================================================================
   layoutReport() —— 给检查器读的那一份测量
   --------------------------------------------------------------------------
   **浏览器是尺子，判定写在 Node 里**（片头那条纪律，DECISIONS_2 309）：
   这一页只负责"量"，_tools/cover_judge.js 负责"判"。量了又判的人会悄悄改判据。

   量的都是**字形的盒子**（Range.selectNodeContents），不是边框盒 ——
   #title 是 left:0;right:0，它的边框盒是整个 1080 宽，比它会说
   "两行字只要在同一行就撞上了"（片头 L5 踩过）。
   ========================================================================== */
function glyphBox(el){
  const rg = document.createRange();
  rg.selectNodeContents(el);
  const b = rg.getBoundingClientRect();
  return {id: el.id, top: +b.top.toFixed(2), bottom: +b.bottom.toFixed(2),
          left: +b.left.toFixed(2), right: +b.right.toFixed(2),
          text: (el.textContent || '').trim().slice(0, 40)};
}
function layoutReport(){
  render(0);
  const st = document.getElementById('stage').getBoundingClientRect();
  const rel = b => ({id: b.id, text: b.text,
    top: +(b.top - st.top).toFixed(2), bottom: +(b.bottom - st.top).toFixed(2),
    left: +(b.left - st.left).toFixed(2), right: +(b.right - st.left).toFixed(2)});

  // 这一页只有四块字。A1 不数数，它按名字点这四样 —— 页面越空，"没有东西可撞"
  // 就越容易通过，所以非真空那一条必须说得出是哪四样在场。
  const TEXT = ['title', 'badge', 'footL', 'footR'];
  const text = TEXT.map(id => rel(glyphBox(document.getElementById(id))));

  // 两个几何的比对：面板的盒子定出的六边形（CSS clip-path 的百分比就长在
  // 这个盒子上）vs SVG 那圈实线（JS 按 HEX_R 算出来的）。逐顶点比。
  const ph = document.getElementById('hexPanel').getBoundingClientRect();
  const boxCx = ph.left - st.left + ph.width / 2, boxCy = ph.top - st.top + ph.height / 2;
  const fromBox = hexPoints(boxCx, boxCy, ph.height / 2);
  const ink = document.querySelector('#hexSvg .ink');
  const fromSvg = ink.getAttribute('points').split(' ').map(s => s.split(',').map(Number))
    .map(([x, y]) => { const s = document.getElementById('hexSvg').getBoundingClientRect();
                       return [x + s.left - st.left, y + s.top - st.top]; });
  let worst = 0, worstAt = null;
  for (let i = 0; i < 6; i++){
    const d = Math.hypot(fromBox[i][0] - fromSvg[i][0], fromBox[i][1] - fromSvg[i][1]);
    if (d > worst){ worst = d; worstAt = i; }
  }

  // 装饰层：每一层声明**它那张素材的极性**（`data-art="white|gradient"`）—— 因为
  // 极性是素材的属性，浏览器量不到（file:// 下 canvas 读背景图会被污染），而
  // "要不要 invert"完全由它决定。声明旁边写着量出那个极性的命令，于是这条断言
  // 不是"信我"，是"这个数是量来的"。规则在 cover_judge A9（只抓样式那一半），
  // "这层到底改了几个像素"由 _tools/cover_layers.sh 量。
  const decor = ['coreMark', 'smMark', 'scan', 'vig'].map(id => {
    const el = document.getElementById(id);
    const cs = getComputedStyle(el);
    return {id, opacity: +(+cs.opacity).toFixed(3), blend: cs.mixBlendMode,
            filter: cs.filter === 'none' ? '' : cs.filter,
            art: el.dataset.art || null};
  });

  // 面板盒子的高宽比必须正好是 2/(2cos30)，否则 CSS 的百分比六边形和 SVG 的
  // 像素六边形不是同一个形状（一个按盒子比例算，一个按半径算）。
  // 厂标的盒子也量出来交给判定：A10 要拿它跟六边的六条边线比距离（它不被裁切，
  // 所以"长得太大"的唯一后果就是它跑到六边外面去，而那在画上不报错）。
  const mk = document.getElementById('coreMark').getBoundingClientRect();
  return JSON.stringify({
    stage:{w: st.width, h: st.height}, innerW: innerWidth, innerH: innerHeight,
    dpr: devicePixelRatio,
    text, decor,
    hex:{boxW: +ph.width.toFixed(2), boxH: +ph.height.toFixed(2),
         ratio: +(ph.height / ph.width).toFixed(6), want: +(2 / (2 * COS30)).toFixed(6),
         worstVertexPx: +worst.toFixed(3), worstAt,
         top: +(boxCy - ph.height / 2).toFixed(2), bottom: +(boxCy + ph.height / 2).toFixed(2),
         left: +(boxCx - ph.width / 2).toFixed(2), right: +(boxCx + ph.width / 2).toFixed(2)},
    frame:{inset: 22, w: 1036, h: 1036},
    mark:{cx: +(mk.left - st.left + mk.width / 2).toFixed(2),
          cy: +(mk.top  - st.top  + mk.height / 2).toFixed(2),
          w: +mk.width.toFixed(2), h: +mk.height.toFixed(2)}
  });
}
</script>
<script>
/* 整体缩放贴合视口：设计空间固定 1080x1080，和片头同一套 fit()。
   渲染器把视口钉成 1080x1080，所以这里 k 恰好是 1，截图就是设计空间本身。 */
function fit(){
  const k = Math.min(innerWidth / 1080, innerHeight / 1080);
  document.getElementById('stage').style.transform = 'scale(' + k + ')';
}
render(0);
fit();
